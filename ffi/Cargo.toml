[package]
name = "regolith-ffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "regolith_ffi"
# staticlib only. Cargo applies the `lto` setting below only when the
# staticlib is the sole crate type; with an rlib alongside it passes no
# `-C lto` at all. The ABI tests therefore live inside the crate
# (src/abi_tests.rs), because a tests/ target could not link this.
crate-type = ["staticlib"]

[dependencies]
regolith = "0.1.7"

[dev-dependencies]
tempfile = "3"

# Cross-crate fat LTO and one codegen unit, matching regolith's own release
# profile. Measured through the Go harness: 9-13% less time per key on the
# 64-byte sequential and transactional write paths, batch writes flat, and the
# archive a third of its size. `panic` stays `unwind`: every entry point
# relies on catch_unwind in `guard`.
[profile.release]
lto = true
codegen-units = 1
